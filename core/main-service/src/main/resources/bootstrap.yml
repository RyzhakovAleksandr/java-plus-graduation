spring:
  application:
    name: main-service
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        max-attempts: 30
        initial-interval: 2000
        multiplier: 1.2
        max-interval: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/